name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to publish (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate SemVer tag and application version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::El tag '$RELEASE_TAG' no cumple el formato vMAJOR.MINOR.PATCH."
            exit 1
          fi

          app_version="$(python -c 'from app.version import __version__; print(__version__)')"
          expected_tag="v${app_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::El tag '$RELEASE_TAG' no coincide con app/version.py ('$expected_tag')."
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "El release $RELEASE_TAG ya existe; no se creará otro."
            exit 0
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$RELEASE_TAG" \
            -f name="$RELEASE_TAG" \
            -f make_latest=true \
            -F generate_release_notes=true
