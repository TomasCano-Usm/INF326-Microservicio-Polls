services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://polls:polls-dev-password@postgres:5432/polls}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - microsvcs

  polls-api:
    build: .
    ports:
      - "${POLLS_PORT:-8004}:8004"
    networks:
      - microsvcs
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://polls:polls-dev-password@postgres:5432/polls}"
      MESSAGES_ENABLED: "${MESSAGES_ENABLED:-false}"
      MESSAGES_BASE_URL: "${MESSAGES_BASE_URL:-}"
      MESSAGES_TIMEOUT_SECONDS: ${MESSAGES_TIMEOUT_SECONDS:-5}
      RABBITMQ_URL: amqp://polls:polls-dev-password@rabbitmq:5672/
      RABBITMQ_EXCHANGE: polls.events
      POLL_CLOSE_SCAN_INTERVAL_SECONDS: ${POLL_CLOSE_SCAN_INTERVAL_SECONDS:-1}
      POLL_RETRY_BASE_SECONDS: ${POLL_RETRY_BASE_SECONDS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8004/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: polls
      RABBITMQ_DEFAULT_PASS: polls-dev-password
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - microsvcs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec '</dev/tcp/127.0.0.1/5672 && </dev/tcp/127.0.0.1/15672'"
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polls
      POSTGRES_USER: polls
      POSTGRES_PASSWORD: polls-dev-password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - microsvcs
    volumes:
      - polls_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polls -d polls"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  polls-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    environment:
      POLLS_SERVICE_URL: http://polls-api:8004
      USERS_SERVICE_URL: "${USERS_SERVICE_URL:-http://users:8000}"
      CHANNELS_SERVICE_URL: "${CHANNELS_SERVICE_URL:-http://channels:8000}"
      MESSAGES_SERVICE_URL: "${MESSAGES_SERVICE_URL:-http://messages:8000}"
      REACTIONS_SERVICE_URL: "${REACTIONS_SERVICE_URL:-http://reactions:8000}"
      SEARCH_SERVICE_URL: "${SEARCH_SERVICE_URL:-http://search:8000}"
      UPSTREAM_TIMEOUT_SECONDS: "${UPSTREAM_TIMEOUT_SECONDS:-5}"
      GATEWAY_CORS_ORIGINS: "${GATEWAY_CORS_ORIGINS:-}"
    depends_on:
      - polls-api
    restart: unless-stopped
    networks:
      - microsvcs

  polls-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${UI_PORT:-3000}:8080"
    depends_on:
      - polls-gateway
    restart: unless-stopped
    networks:
      - microsvcs

networks:
  microsvcs:
    name: microsvcs

volumes:
  polls_postgres_data:
