apiVersion: apps/v1
kind: Deployment
metadata:
  name: polls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polls
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: polls
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: polls
          image: ghcr.io/tomascano-usm/inf326-microservicio-polls:1.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
              protocol: TCP
          envFrom:
            - configMapRef:
                name: polls-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: polls-credentials
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: polls-credentials
                  key: RABBITMQ_URL
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8004"]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
