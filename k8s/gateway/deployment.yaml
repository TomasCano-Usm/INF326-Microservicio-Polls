apiVersion: apps/v1
kind: Deployment
metadata:
  name: polls-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polls-gateway
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: polls-gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: ghcr.io/tomascano-usm/inf326-polls-gateway:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: polls-gateway-config
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
